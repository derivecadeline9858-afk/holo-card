<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080812">
<title>雨天旅人 · 立体镭射闪光卡</title>
<style>
  :root {
    --bg-art: none;
    --fg-art: none;
    --ink: #f8fbff;
    --muted: rgba(238, 244, 255, .68);
    --cyan: #67e8f9;
    --pink: #ff5ac8;
    --violet: #8b5cf6;
    --lime: #b8ff7a;
    --gold: #ffd76a;
    --rx: 0deg;
    --ry: 0deg;
    --mx: 0;
    --my: 0;
    --px: 50;
    --py: 50;
    --angle: 135;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  body {
    overflow: hidden;
    display: grid;
    place-items: center;
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(circle at 18% 18%, rgba(139, 92, 246, .28), transparent 30vw),
      radial-gradient(circle at 82% 24%, rgba(103, 232, 249, .18), transparent 28vw),
      radial-gradient(circle at 50% 88%, rgba(255, 90, 200, .16), transparent 34vw),
      linear-gradient(145deg, #05050a 0%, #0b0d18 48%, #07070d 100%);
  }

  /* 地面网格 */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    pointer-events: none;
    background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at center, black 0 36%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at center, black 0 36%, transparent 72%);
    transform: perspective(900px) rotateX(62deg) translateY(18%);
    opacity: .52;
  }

  /* 背景漂星 */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 22% 28%, rgba(255,255,255,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 72% 18%, rgba(103,232,249,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 84% 72%, rgba(255,90,200,.55) 0 1px, transparent 1.8px),
      radial-gradient(circle at 14% 78%, rgba(255,215,106,.55) 0 1px, transparent 1.8px);
    background-size: 260px 260px, 340px 340px, 300px 300px, 380px 380px;
    animation: starDrift 18s linear infinite;
    opacity: .38;
  }
  @keyframes starDrift {
    to { background-position: 260px 520px, -340px 340px, 300px -600px, -380px -380px; }
  }

  .scene {
    position: relative;
    z-index: 1;
    width: min(92vw, 520px);
    display: grid;
    justify-items: center;
    gap: 22px;
    padding: 24px 0;
  }

  .stage {
    position: relative;
    width: min(88vw, 430px);
    perspective: 1400px;
    perspective-origin: 50% 50%;
    touch-action: none;
    cursor: grab;
  }
  .stage:active { cursor: grabbing; }

  /* 卡片在桌面上的投影，随偏转反向移动 */
  .card-shadow {
    position: absolute;
    left: 8%; right: 8%;
    bottom: -42px;
    height: 54px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.58), rgba(0,0,0,.22) 48%, transparent 72%);
    filter: blur(10px);
    transform: translateX(calc(var(--mx) * -18px)) scaleX(calc(1 + (var(--mx) * var(--mx)) * .08));
  }

  .card {
    position: relative;
    aspect-ratio: 63 / 88;
    border-radius: 30px;
    transform-style: preserve-3d;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    will-change: transform;
    filter:
      drop-shadow(calc(var(--mx) * -18px) calc(22px + var(--my) * 8px) 30px rgba(0, 0, 0, .46))
      drop-shadow(0 0 28px rgba(103, 232, 249, .12));
  }

  /* 旋转彩虹描边 */
  .card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 32px;
    background:
      conic-gradient(from calc(var(--angle) * 1deg),
        #fff7ad 0deg, #67e8f9 42deg, #8b5cf6 92deg, #ff5ac8 148deg,
        #ffffff 205deg, #b8ff7a 262deg, #ffd76a 318deg, #fff7ad 360deg);
    transform: translateZ(-8px);
    filter: saturate(1.2);
  }

  /* 内圈金属丝框 */
  .card::after {
    content: "";
    position: absolute;
    inset: 8px;
    z-index: 42;
    border-radius: 23px;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,.44);
    box-shadow:
      inset 0 0 0 1px rgba(8, 10, 20, .78),
      inset 0 0 22px rgba(255,255,255,.12),
      inset 0 0 70px rgba(103,232,249,.10);
    transform: translateZ(138px);
  }

  .card-face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 30px;
    transform-style: preserve-3d;
    background:
      linear-gradient(145deg, rgba(255,255,255,.12), transparent 22%),
      radial-gradient(circle at 50% 0%, rgba(103,232,249,.20), transparent 38%),
      linear-gradient(180deg, #181b2d 0%, #0b0d18 72%, #090a12 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.30),
      inset 0 -1px 0 rgba(0,0,0,.82),
      inset 0 0 0 1px rgba(255,255,255,.10);
  }

  /* 插画放大模糊做环境光晕，反向漂移 */
  .art-aura {
    position: absolute;
    inset: -10%;
    background-image: var(--bg-art);
    background-size: cover;
    background-position: center;
    filter: blur(22px) saturate(1.55) brightness(.64) contrast(1.08);
    opacity: .86;
    transform: translate3d(calc(var(--mx) * -24px), calc(var(--my) * -20px), -92px) scale(1.22);
    will-change: transform;
  }
  .aura-veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 38%, transparent 0 30%, rgba(7,7,13,.26) 58%, rgba(7,7,13,.88) 100%),
      linear-gradient(180deg, rgba(255,255,255,.08), transparent 26%, rgba(0,0,0,.28));
    transform: translateZ(-42px);
  }

  /* ===== 插画视窗：真实双层视差 ===== */
  .art-window {
    position: absolute;
    inset: 11% 7% 27.5%;
    overflow: hidden;
    border-radius: 20px;
    transform-style: preserve-3d;
    transform: translateZ(42px);
    background: #101322;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.28),
      0 12px 28px rgba(0,0,0,.34),
      inset 0 0 0 1px rgba(0,0,0,.60);
  }
  .art-window::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 8;
    pointer-events: none;
    border-radius: inherit;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -18px 34px rgba(0,0,0,.20),
      inset 0 0 44px rgba(103,232,249,.10);
    transform: translateZ(116px);
  }

  .art-layer {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    will-change: transform;
    backface-visibility: hidden;
  }
  /* 远景：雨天荒原 */
  .art-bg {
    background-image: var(--bg-art);
    transform: translate3d(calc(var(--mx) * 6px), calc(var(--my) * 5px), 0) scale(1.14);
    filter: saturate(.95) brightness(.92);
  }
  /* 近景：抠出的角色，浮起最深 */
  .art-fg {
    background-image: var(--fg-art);
    transform: translate3d(calc(var(--mx) * 22px), calc(var(--my) * 17px), 72px) scale(1.06);
    filter: saturate(1.08) contrast(1.04) drop-shadow(0 14px 18px rgba(0,0,0,.35));
  }
  .art-depth-shade {
    position: absolute;
    inset: 0;
    z-index: 7;
    pointer-events: none;
    background:
      radial-gradient(circle at calc(50% + var(--mx) * 16%) calc(42% + var(--my) * 12%), transparent 0 32%, rgba(0,0,0,.10) 56%, rgba(0,0,0,.32) 100%),
      linear-gradient(180deg, rgba(255,255,255,.10), transparent 18%, transparent 76%, rgba(0,0,0,.24));
    mix-blend-mode: multiply;
    transform: translateZ(112px);
  }

  /* 角标文字 */
  .frame-mark {
    position: absolute;
    z-index: 46;
    color: rgba(255,255,255,.78);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(0,0,0,.55);
    transform: translateZ(150px);
    user-select: none;
  }
  .frame-mark.top-left { top: 22px; left: 24px; }
  .frame-mark.top-right { top: 22px; right: 24px; color: var(--gold); }
  .frame-mark.bottom-right { right: 24px; bottom: 22px; color: rgba(103,232,249,.88); }

  /* 底部信息面板 */
  .caption {
    position: absolute;
    left: 7%; right: 7%;
    bottom: 6.3%;
    z-index: 44;
    min-height: 17%;
    padding: 18px 18px 16px;
    border-radius: 18px;
    transform: translateZ(122px);
    background:
      linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.055) 38%, rgba(103,232,249,.10)),
      rgba(7, 8, 15, .62);
    border: 1px solid rgba(255,255,255,.20);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.20),
      0 16px 30px rgba(0,0,0,.24);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
  }
  .caption::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(105deg, transparent 0 32%, rgba(255,255,255,.22) 45%, transparent 58% 100%);
    transform: translateX(calc(var(--mx) * 34%));
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    color: rgba(103,232,249,.88);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .eyebrow i {
    width: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.72), transparent);
    font-style: normal;
  }
  h1 {
    font-size: clamp(28px, 8vw, 42px);
    line-height: .98;
    letter-spacing: .03em;
    font-weight: 950;
    background: linear-gradient(92deg, #ffffff 8%, #fff3a3 28%, #8ff4ff 48%, #ff8bdd 72%, #ffffff 94%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(103,232,249,.18);
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }
  .chip {
    padding: 5px 8px;
    border-radius: 999px;
    color: rgba(255,255,255,.78);
    font-size: 9px;
    font-weight: 850;
    letter-spacing: .12em;
    text-transform: uppercase;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.14);
  }
  .chip.hot {
    color: #1b1020;
    background: linear-gradient(90deg, var(--gold), #ff9bdc);
    border-color: rgba(255,255,255,.38);
  }

  /* 四角括号 */
  .corner {
    position: absolute;
    z-index: 48;
    width: 28px;
    height: 28px;
    pointer-events: none;
    transform: translateZ(155px);
    opacity: .86;
  }
  .corner::before, .corner::after {
    content: "";
    position: absolute;
    background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(103,232,249,.55));
    box-shadow: 0 0 10px rgba(103,232,249,.35);
  }
  .corner::before { width: 100%; height: 2px; }
  .corner::after { width: 2px; height: 100%; }
  .corner.tl { top: 15px; left: 15px; }
  .corner.tr { top: 15px; right: 15px; transform: translateZ(155px) scaleX(-1); }
  .corner.bl { bottom: 15px; left: 15px; transform: translateZ(155px) scaleY(-1); }
  .corner.br { right: 15px; bottom: 15px; transform: translateZ(155px) scale(-1); }

  /* ===== 光效层 ===== */
  .fx {
    position: absolute;
    inset: 0;
    z-index: 30;
    overflow: hidden;
    border-radius: 30px;
    pointer-events: none;
    transform-style: preserve-3d;
  }

  /* 指针处绽放的锥形彩虹 */
  .holo-rainbow {
    position: absolute;
    inset: -18%;
    background:
      conic-gradient(from calc(var(--angle) * 1deg) at calc(var(--px) * 1%) calc(var(--py) * 1%),
        transparent 0deg,
        rgba(255, 0, 128, .42) 28deg,
        rgba(255, 180, 0, .38) 62deg,
        rgba(184, 255, 122, .34) 96deg,
        rgba(0, 225, 255, .44) 138deg,
        rgba(82, 96, 255, .42) 184deg,
        rgba(210, 64, 255, .42) 232deg,
        rgba(255, 0, 128, .28) 292deg,
        transparent 360deg);
    mix-blend-mode: color-dodge;
    opacity: .52;
    filter: saturate(1.5) blur(.2px);
    transform: translateZ(126px) rotate(calc(var(--mx) * 2deg));
    will-change: background, transform;
  }

  /* 镭射拉丝纹 */
  .foil-lines {
    position: absolute;
    inset: -20%;
    background-image:
      repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-32deg, rgba(103,232,249,.14) 0 2px, transparent 2px 11px),
      repeating-radial-gradient(circle at calc(var(--px) * 1%) calc(var(--py) * 1%), rgba(255,255,255,.16) 0 1px, transparent 1px 9px);
    background-position:
      calc(var(--mx) * -90px) calc(var(--my) * 48px),
      calc(var(--mx) * 70px) calc(var(--my) * -78px),
      0 0;
    mix-blend-mode: overlay;
    opacity: .50;
    transform: translateZ(132px);
  }

  /* 棱镜扫光：随视角滑动 + 闲置时自动流转变色 */
  .prism-sweep {
    position: absolute;
    inset: -34% -46%;
    background: linear-gradient(104deg,
      transparent 30%,
      rgba(255,255,255,.05) 39%,
      rgba(255,255,255,.78) 47%,
      rgba(103,232,249,.44) 51%,
      rgba(255,90,200,.30) 55%,
      transparent 66%);
    mix-blend-mode: screen;
    opacity: .68;
    transform: translateX(calc(-34% + (var(--mx) + 1) * 34%)) rotate(9deg) translateZ(146px);
    animation: idleSweep 5.8s linear infinite;
    will-change: transform;
  }
  @keyframes idleSweep {
    0%, 100% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(92deg) brightness(1.18); }
  }

  /* 镜面高光 */
  .glare {
    position: absolute;
    inset: -12%;
    background:
      radial-gradient(circle at calc(var(--px) * 1%) calc(var(--py) * 1%),
        rgba(255,255,255,.98) 0%,
        rgba(255,255,255,.48) 7%,
        rgba(103,232,249,.30) 15%,
        rgba(255,90,200,.16) 25%,
        transparent 43%);
    mix-blend-mode: screen;
    opacity: .76;
    transform: translateZ(142px);
    will-change: background;
  }

  /* 四角星闪粉 */
  .sparkle-field {
    position: absolute;
    inset: 0;
    z-index: 38;
    transform: translateZ(154px);
    pointer-events: none;
  }
  .sparkle {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    opacity: 0;
    background: radial-gradient(circle, #fff 0 12%, rgba(255,255,255,.88) 20%, rgba(103,232,249,.42) 42%, transparent 72%);
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 8px rgba(255,255,255,.75));
    animation: twinkle var(--d) ease-in-out var(--dl) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.34) rotate(0deg); }
    42% { opacity: 0; }
    50% { opacity: .96; transform: scale(1) rotate(45deg); }
    58% { opacity: 0; }
  }

  /* 点击闪光冲击波 */
  .burst-ring {
    position: absolute;
    z-index: 52;
    left: calc(var(--px) * 1%);
    top: calc(var(--py) * 1%);
    width: 24px;
    height: 24px;
    margin: -12px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.92);
    box-shadow: 0 0 22px rgba(103,232,249,.65), inset 0 0 14px rgba(255,90,200,.42);
    transform: translateZ(170px) scale(0);
    pointer-events: none;
  }
  .card.is-bursting .burst-ring { animation: burst .68s var(--ease); }
  @keyframes burst {
    0% { opacity: .95; transform: translateZ(170px) scale(0); }
    100% { opacity: 0; transform: translateZ(170px) scale(12); }
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .08em;
    text-align: center;
    user-select: none;
  }
  .hint::before, .hint::after {
    content: "";
    width: 34px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.42));
  }
  .hint::after { transform: scaleX(-1); }

  @media (max-width: 520px) {
    .scene { width: 100vw; gap: 16px; }
    .stage { width: min(86vw, 390px); }
    .caption { padding: 15px 15px 13px; }
    .meta { margin-top: 9px; }
    .chip { font-size: 8px; }
    .hint { font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
    }
    .card { transform: none !important; }
  }
</style>
</head>
<body>
  <main class="scene" aria-label="可交互立体镭射闪光卡">
    <section class="stage" id="stage" aria-label="移动鼠标或拖动手指，卡片会跟随视角偏转">
      <div class="card-shadow" aria-hidden="true"></div>
      <article class="card" id="card">
        <div class="card-face">
          <div class="art-aura" aria-hidden="true"></div>
          <div class="aura-veil" aria-hidden="true"></div>

          <figure class="art-window" aria-label="雨天里叼着树枝的黄色小家伙">
            <div class="art-layer art-bg"></div>
            <div class="art-layer art-fg" aria-hidden="true"></div>
            <div class="art-depth-shade" aria-hidden="true"></div>
          </figure>

          <div class="frame-mark top-left">Holographic</div>
          <div class="frame-mark top-right">Prism ✦ SSR</div>
          <div class="frame-mark bottom-right">No. 2026 · Rain-001</div>

          <section class="caption">
            <div class="eyebrow"><span>Rainbow foil card</span><i></i><span>Parallax</span></div>
            <h1>雨天旅人</h1>
            <div class="meta" aria-label="卡片特性">
              <span class="chip hot">Lucky Burst</span>
              <span class="chip">Multi-layer</span>
              <span class="chip">3D Tilt</span>
              <span class="chip">Holo Shine</span>
            </div>
          </section>

          <div class="fx" aria-hidden="true">
            <div class="holo-rainbow"></div>
            <div class="foil-lines"></div>
            <div class="prism-sweep"></div>
            <div class="glare"></div>
            <div class="sparkle-field" id="sparkles"></div>
          </div>

          <span class="corner tl" aria-hidden="true"></span>
          <span class="corner tr" aria-hidden="true"></span>
          <span class="corner bl" aria-hidden="true"></span>
          <span class="corner br" aria-hidden="true"></span>
          <span class="burst-ring" aria-hidden="true"></span>
        </div>
      </article>
    </section>
    <p class="hint">移动鼠标 / 拖动手指 · 点击触发闪光</p>
  </main>

  (() => {
    const stage = document.getElementById('stage');
    const card = document.getElementById('card');
    const sparkles = document.getElementById('sparkles');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 生成 44 颗四角星闪粉
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < 44; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.style.setProperty('--x', `${4 + Math.random() * 92}%`);
      s.style.setProperty('--y', `${4 + Math.random() * 92}%`);
      s.style.setProperty('--s', `${5 + Math.random() * 12}px`);
      s.style.setProperty('--d', `${2.8 + Math.random() * 4.8}s`);
      s.style.setProperty('--dl', `${-Math.random() * 7}s`);
      fragment.appendChild(s);
    }
    sparkles.appendChild(fragment);

    if (reduceMotion) return;

    let targetX = 0, targetY = 0;
    let currentX = 0, currentY = 0;
    let lastX = 0, lastY = 0;
    let velocity = 0;

    const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

    function setTarget(clientX, clientY) {
      const rect = card.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      const px = clamp((clientX - rect.left) / rect.width, 0, 1);
      const py = clamp((clientY - rect.top) / rect.height, 0, 1);
      targetX = (px - .5) * 2;
      targetY = (py - .5) * 2;
    }

    stage.addEventListener('pointermove', (e) => setTarget(e.clientX, e.clientY), { passive: true });

    // 点击：触发闪光冲击波
    stage.addEventListener('pointerdown', (e) => {
      setTarget(e.clientX, e.clientY);
      card.classList.remove('is-bursting');
      void card.offsetWidth;
      card.classList.add('is-bursting');
    }, { passive: true });

    stage.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; }, { passive: true });

    // 陀螺仪
    window.addEventListener('deviceorientation', (e) => {
      if (typeof e.gamma !== 'number' || typeof e.beta !== 'number') return;
      targetX = clamp(e.gamma / 28, -1, 1);
      targetY = clamp((e.beta - 42) / 34, -1, 1);
    }, { passive: true });

    function render() {
      currentX += (targetX - currentX) * .115;
      currentY += (targetY - currentY) * .115;

      // 速度越快，彩虹转得越猛
      const dx = currentX - lastX;
      const dy = currentY - lastY;
      velocity += ((Math.abs(dx) + Math.abs(dy)) * 24 - velocity) * .08;
      lastX = currentX;
      lastY = currentY;

      const rotateY = currentX * 15.5;
      const rotateX = currentY * -12.5;
      const px = (currentX + 1) * 50;
      const py = (currentY + 1) * 50;
      const angle = 118 + currentX * 72 + currentY * 38 + velocity * 4;

      card.style.setProperty('--rx', `${rotateX.toFixed(3)}deg`);
      card.style.setProperty('--ry', `${rotateY.toFixed(3)}deg`);
      card.style.setProperty('--mx', currentX.toFixed(4));
      card.style.setProperty('--my', currentY.toFixed(4));
      card.style.setProperty('--px', px.toFixed(2));
      card.style.setProperty('--py', py.toFixed(2));
      card.style.setProperty('--angle', angle.toFixed(2));

      requestAnimationFrame(render);
    }
    render();
  })();
</script>
